name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule une exécution en cours si un nouveau commit arrive sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires (Vitest, PGlite en mémoire)
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Test de bout en bout (Playwright, API simulée)
        run: npm run test:e2e
        env:
          CI: true

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
